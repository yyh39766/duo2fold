name: Build DuoFold deb

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (rootless, arm64 + arm64e)
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid / xz
        run: brew install ldid xz

      - name: Setup Theos and iOS SDKs
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: |
          set -e
          make clean
          make package FINALPACKAGE=1
          ls -la packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DuoFold-deb
          path: packages/*.deb
          if-no-files-found: error
